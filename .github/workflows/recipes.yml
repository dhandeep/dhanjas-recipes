name: Recipes

# Push a recipe .json (format 3, docs/RECIPE-SPEC.md — or an older v2 .html) into
# inbox/ — from the GitHub web UI, the GitHub app, or Claude — and this workflow
# validates it, saves it as data/recipes/<slug>.json, builds the site (<slug>.html,
# served as /<slug>), renders every page in Chromium (tools/browser-check.mjs), and
# only then commits the new recipe data and deploys the site to GitHub Pages.
# Pull requests get the same checks without the commit or deploy.

on:
  push:
    branches: [main]
    paths: ["inbox/**", "data/**", "tools/**", "assets/**", "schema/**", "package*.json", ".github/workflows/recipes.yml"]
  pull_request:
    paths: ["inbox/**", "data/**", "tools/**", "assets/**", "schema/**", "package*.json", ".github/workflows/recipes.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recipes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Each check below reports without stopping the run: one bad recipe gets a stand-in
    # page and the rest of the site still deploys. Only a broken front page blocks the
    # deploy (the last good version then stays live). The "problems" job turns the run red.
    outputs:
      tests: ${{ steps.tests.outcome }}
      ingest: ${{ steps.ingest.outcome }}
      validate: ${{ steps.validate.outcome }}
      browser: ${{ steps.browser.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        id: tests
        continue-on-error: true
        run: python -m unittest discover -s tools

      # A rejected inbox file stays in inbox/; the rest of the site still builds.
      - name: Ingest inbox/
        id: ingest
        continue-on-error: true
        run: python tools/recipes.py ingest

      - name: Validate
        id: validate
        continue-on-error: true
        run: python tools/recipes.py validate --errors-only

      # A recipe with errors is held back: a stand-in page at its address, off the front page.
      - name: Build
        run: python tools/recipes.py build

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Browser check (every page, desktop + phone, scaling, pixel parity with v2)
        id: browser
        continue-on-error: true
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run check:browser -- --shots screenshots --report browser-report.json

      # The one thing that blocks a deploy: a front page that didn't pass (or a check that
      # never ran). The site then keeps serving its last good version.
      - name: Front page must pass before deploying
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("browser-report.json")
          if not p.exists():
              print("::error::The browser check didn't run, so nothing is deployed."); sys.exit(1)
          r = json.loads(p.read_text())
          if not r["indexOk"]:
              print("::error::The front page failed the browser check, so nothing is deployed."); sys.exit(1)
          print("Front page OK — deploying. Held back:", ", ".join(r["held"]) or "none")
          PY

      # Only what the website needs is published — not docs/, tools/, data/ or inbox/.
      - name: Assemble the public site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp *.html CNAME _site/
          cp -r assets recipes schema _site/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

      # Only the recipe data is committed (an ingested inbox file becomes data/recipes/<slug>.json);
      # the pages themselves are built fresh on every run and deployed below, never committed.
      - name: Commit ingested recipes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data inbox
          if git diff --cached --quiet; then
            echo "No new recipes to commit."
          else
            git commit -m "Ingest recipes"
            git push
          fi

  # Publishes the checked build (Settings → Pages → Source: GitHub Actions).
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Turns the run red when any check found a problem, after the rest of the site deployed.
  problems:
    needs: [build, deploy]
    if: >-
      always() && (needs.build.outputs.tests == 'failure' || needs.build.outputs.ingest == 'failure' ||
      needs.build.outputs.validate == 'failure' || needs.build.outputs.browser == 'failure')
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Tests: ${{ needs.build.outputs.tests }} · Inbox: ${{ needs.build.outputs.ingest }} · Validate: ${{ needs.build.outputs.validate }} · Browser check: ${{ needs.build.outputs.browser }}"
          echo "::error::Something needs fixing (see the build job's red steps). Recipes with errors show a stand-in page; the rest of the site was deployed."
          exit 1
