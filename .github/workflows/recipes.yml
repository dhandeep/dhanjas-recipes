name: Recipes

# Push a v2 recipe .html (or .json) into inbox/ — from the GitHub web UI, the
# GitHub app, or Claude — and this workflow validates it, converts it to
# data/recipes/<slug>.json, rebuilds the site, renders every page in Chromium
# (tools/browser-check.mjs) and only then commits the result.
# Pull requests get the same checks without the commit.

on:
  push:
    branches: [main]
    paths: ["inbox/**", "data/**", "tools/**", "assets/**", "schema/**", "package*.json", ".github/workflows/recipes.yml"]
  pull_request:
    paths: ["inbox/**", "data/**", "tools/**", "assets/**", "schema/**", "package*.json", ".github/workflows/recipes.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recipes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tools

      - name: Ingest inbox/
        run: python tools/recipes.py ingest

      - name: Validate and build
        run: |
          python tools/recipes.py validate --errors-only
          python tools/recipes.py build --strict

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Browser check (every page, desktop + phone, scaling, pixel parity with v2)
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run check:browser -- --shots screenshots

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

      - name: Commit the result
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data recipes index.html assets/recipes.json inbox
          if git diff --cached --quiet; then
            echo "Site already up to date."
          else
            git commit -m "Ingest recipes and rebuild site"
            git push
          fi

      - name: Site is up to date (PRs)
        if: github.event_name == 'pull_request'
        run: |
          if [ -z "$(ls inbox | grep -v README)" ] && ! git diff --quiet -- recipes index.html assets/recipes.json; then
            echo "::error::Generated pages are stale — run 'python3 tools/recipes.py build' and commit."
            git diff --stat
            exit 1
          fi
