name: Recipes

# Push a recipe .json (format 3, docs/RECIPE-SPEC.md — or an older v2 .html) into
# inbox/ — from the GitHub web UI, the GitHub app, or Claude — and this workflow
# validates it, saves it as data/recipes/<slug>.json, builds the site (<slug>.html,
# served as /<slug>), renders every page in Chromium (tools/browser-check.mjs), and
# only then commits the new recipe data and deploys the site to GitHub Pages.
# Pull requests get the same checks without the commit or deploy.

on:
  push:
    branches: [main]
    paths: ["inbox/**", "data/**", "tools/**", "assets/**", "schema/**", "package*.json", ".github/workflows/recipes.yml"]
  pull_request:
    paths: ["inbox/**", "data/**", "tools/**", "assets/**", "schema/**", "package*.json", ".github/workflows/recipes.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recipes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tools

      - name: Ingest inbox/
        run: python tools/recipes.py ingest

      - name: Validate and build
        run: |
          python tools/recipes.py validate --errors-only
          python tools/recipes.py build --strict

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Browser check (every page, desktop + phone, scaling, pixel parity with v2)
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run check:browser -- --shots screenshots

      # Only what the website needs is published — not docs/, tools/, data/ or inbox/.
      - name: Assemble the public site
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p _site
          cp *.html CNAME _site/
          cp -r assets recipes schema _site/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

      # Only the recipe data is committed (an ingested inbox file becomes data/recipes/<slug>.json);
      # the pages themselves are built fresh on every run and deployed below, never committed.
      - name: Commit ingested recipes
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data inbox
          if git diff --cached --quiet; then
            echo "No new recipes to commit."
          else
            git commit -m "Ingest recipes"
            git push
          fi

  # Publishes the checked build (Settings → Pages → Source: GitHub Actions).
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
